service: time-checker-service

provider:
  deploymentBucket:
    name: deployment-bucket-for-sls
  name: aws
  runtime: python3.9
  region: ap-south-1             # Mumbai region                   

functions:
  timeChecker:
    name: time-checker-lambda
    description: "Lambda function to check if target time has been reached"
    handler: index.lambda_handler
    role: arn:aws:iam::126532164424:role/TestingLambdaRole
    package:
      artifacts: src/handler/time_checker_lambda/zippedPackage/deployment_package_time_checker_lambda.zip
    
      

